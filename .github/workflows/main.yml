name: Main workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  GIT_COMMIT: ${{ github.sha }}
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build backend
        run: go build ./...
        working-directory: backend
      - name: Build frontend
        run: go build ./...
        working-directory: frontend
      - name: Test frontend
        run: go test ./...
        working-directory: frontend
  Docker-image:
    runs-on: ubuntu-latest
    needs: [Build]
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Log in to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Setup docker build
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ env.GIT_COMMIT }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
  Deploy:
    runs-on: ubuntu-latest
    needs: [Docker-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' #Job only runs when something is pushed directly to main. 
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          chmod +x scripst/deploy.sh 
          ./scripts/deploy.sh  