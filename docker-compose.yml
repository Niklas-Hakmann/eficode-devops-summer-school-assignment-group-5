version: v1

services:
  
  backend:
    container_name: backend
    image: backend:latest
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_DNS: redis
    ports:
      - 9000
    
  frontend:
    container_name: frontend
    image: frontend:latest
    ports:
      - 8080
    environment:
      BACKEND_DNS: backend
      BACKEND_PORT: 9000
    depends_on:
      - backend